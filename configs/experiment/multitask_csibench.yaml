dataset: csibench
task: multitask
method: clip_infonce

# Portable multitask config for CSI-Bench (5 tasks). Each task_root is
# *relative* to dataset_config.data_root, which the trainer resolves at
# startup (see ``resolve_task_roots`` in data/multitask_dataset.py).
#
# To retarget the data location:
#
#   * Local checkout (Windows/macOS/Linux):
#       python -m training.multitask_train \
#           --config configs/experiment/multitask_csibench.yaml \
#           --override dataset_config.data_root=/path/to/Dataset
#
#   * SageMaker:
#       python -m training.multitask_train \
#           --config configs/experiment/multitask_csibench.yaml \
#           --override dataset_config.data_root=/home/sagemaker-user/Multimodal_CSI_Text/Dataset
#
# The default below assumes the dataset lives at ``<repo>/data/Dataset``.

dataset_config:
  data_root: data/Dataset
  preprocessing:
    input_channels: 1
    target_subcarriers: 64
    target_time_steps: 500
    normalize: true

multitask:
  sampling: proportional
  tasks:
    # -- CSI-Bench (multitask layout: shared sub_Human under csibench/multitask/) --
    - task_name: har
      task_root: csibench/multitask/har
      h5_key: CSI_amps
    - task_name: proximity
      task_root: csibench/multitask/proximity
      h5_key: CSI_amps
    - task_name: user_id
      task_root: csibench/multitask/user_id
      h5_key: CSI_amps
    # -- CSI-Bench (standalone tasks with their own sub_* directories) --
    - task_name: fall_detection
      task_root: csibench/fall_detection
      h5_key: CSI_amps
    - task_name: motion_source
      task_root: csibench/motion_source
      h5_key: CSI_amps

csi_encoder:
  name: resnet18_1d
  pretrained: false
  dropout: 0.1

text_encoder:
  name: clip_vit_b32
  frozen: true

projection:
  dim: 512
  hidden_dim: 1024
  num_layers: 2
  dropout: 0.1

training:
  batch_size: 128
  learning_rate: 5.0e-4
  weight_decay: 1.0e-4
  max_epochs: 200
  warmup_epochs: 5
  scheduler: cosine
  early_stopping_patience: 15
  grad_clip: 1.0
  num_workers: 4
  prefetch_factor: 2
  persistent_workers: true
  seed: 42
  preload: false

  amp: true
  amp_dtype: bfloat16
  accumulation_steps: 1

augmentation:
  enabled: true
  time_mask_ratio: 0.1
  subcarrier_mask_ratio: 0.1
  noise_std: 0.05
  scale_min: 0.9
  scale_max: 1.1
  p: 0.5

logging:
  use_wandb: false
  project_name: csi-text-alignment
  log_every_n_steps: 50
  checkpoint_dir: runs/checkpoints

evaluation:
  zero_shot: true
  cross_task: true

s3:
  enabled: false
