dataset: csibench
task: har
method: clip_infonce

csi_encoder:
  name: resnet18_1d
  pretrained: false

text_encoder:
  name: clip_vit_b32
  frozen: true

projection:
  dim: 512
  hidden_dim: 1024
  num_layers: 2

training:
  batch_size: 128
  learning_rate: 1.0e-3
  weight_decay: 1.0e-5
  max_epochs: 200
  warmup_epochs: 5
  scheduler: cosine
  early_stopping_patience: 10
  grad_clip: 1.0
  num_workers: 4
  prefetch_factor: 2
  persistent_workers: true
  seed: 42
  preload: false

  # Mixed precision
  amp: true
  amp_dtype: bfloat16

  # Gradient accumulation
  accumulation_steps: 1

text_generation:
  num_paraphrases: 5
  use_llm: false
  text_level: level1

logging:
  use_wandb: false
  project_name: csi-text-alignment
  log_every_n_steps: 50
  checkpoint_dir: checkpoints

evaluation:
  zero_shot: true
  ambient_qa: true
  cross_task: false
  cross_dataset: false

s3:
  enabled: true
  bucket: rnd-sagemaker
  prefix: Multimodal_CSI_Text
  sync_checkpoints: true
  sync_evaluation: true
  sync_dataset: true
