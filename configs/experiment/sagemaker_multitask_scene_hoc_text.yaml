dataset: csibench
# Distinct task name so the checkpoint lands in its own directory
# (multitask_train names it "<dataset>-<task>-<method>") and neither the
# baseline nor the strict HOC checkpoint is clobbered.
task: multitask_scene_hoc_text
method: clip_infonce

# Held-out-composition (text) variant of sagemaker_multitask_scene.yaml.
# Samples whose (user, activity, proximity) combination is withheld stay in
# training with all their Level 1 attribute captions; only their Level 2
# composite caption is stripped from the pair registry.  The signal condition
# is therefore familiar and only the composed sentence is novel, which isolates
# composition in text space from novelty in the signal.  Build the task roots
# first:
#
#   PYTHONPATH=. python scripts/build_composition_splits.py \
#       --config configs/experiment/sagemaker_multitask_scene.yaml --mode both
multitask:
  sampling: proportional
  tasks:
    - task_name: har
      task_root: /home/sagemaker-user/Multimodal_CSI_Text/Dataset/csibench/multitask_hoc_text/har
      h5_key: CSI_amps
    - task_name: proximity
      task_root: /home/sagemaker-user/Multimodal_CSI_Text/Dataset/csibench/multitask_hoc_text/proximity
      h5_key: CSI_amps
    - task_name: user_id
      task_root: /home/sagemaker-user/Multimodal_CSI_Text/Dataset/csibench/multitask_hoc_text/user_id
      h5_key: CSI_amps

dataset_config:
  preprocessing:
    input_channels: 1
    target_subcarriers: 64
    target_time_steps: 500
    normalize: true

csi_encoder:
  name: resnet18_1d
  pretrained: false
  dropout: 0.1

text_encoder:
  name: clip_vit_b32
  frozen: true

projection:
  dim: 512
  hidden_dim: 1024
  num_layers: 2
  dropout: 0.1

training:
  batch_size: 128
  learning_rate: 5.0e-4
  weight_decay: 1.0e-4
  max_epochs: 200
  warmup_epochs: 5
  scheduler: cosine
  early_stopping_patience: 15
  grad_clip: 1.0
  num_workers: 4
  prefetch_factor: 2
  persistent_workers: true
  seed: 42
  preload: false

  amp: true
  amp_dtype: bfloat16
  accumulation_steps: 1

augmentation:
  enabled: true
  time_mask_ratio: 0.1
  subcarrier_mask_ratio: 0.1
  noise_std: 0.05
  scale_min: 0.9
  scale_max: 1.1
  p: 0.5

logging:
  use_wandb: false
  project_name: csi-text-alignment
  log_every_n_steps: 50
  checkpoint_dir: /home/sagemaker-user/Multimodal_CSI_Text/Model/checkpoints

evaluation:
  zero_shot: true
  cross_task: true

s3:
  enabled: true
  bucket: rnd-sagemaker
  prefix: Multimodal_CSI_Text
  sync_checkpoints: true
  sync_evaluation: true
  sync_dataset: true
