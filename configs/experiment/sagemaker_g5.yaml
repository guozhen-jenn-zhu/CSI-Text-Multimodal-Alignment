dataset: csibench
task: har
method: clip_infonce

# -- Data paths (SageMaker Studio JupyterLab) --
# Overridden per-task by the launch script; these are defaults for HAR.
dataset_config:
  data_root: /home/sagemaker-user/Multimodal_CSI_Text/Dataset/csibench/multitask
  preprocessing:
    input_channels: 1
    target_subcarriers: 64
    target_time_steps: 500
    normalize: true

csi_encoder:
  name: resnet18_1d
  pretrained: false
  dropout: 0.1

text_encoder:
  name: clip_vit_b32
  frozen: true

projection:
  dim: 512
  hidden_dim: 1024
  num_layers: 2
  dropout: 0.1

training:
  # g5.8xlarge: 1x A10G (24 GB), g5.24xlarge: 4x, g5.48xlarge: 8x
  batch_size: 128
  learning_rate: 5.0e-4
  weight_decay: 1.0e-4
  max_epochs: 100
  warmup_epochs: 5
  scheduler: cosine
  early_stopping_patience: 15
  grad_clip: 1.0
  num_workers: 4
  prefetch_factor: 2
  persistent_workers: true
  seed: 42
  preload: false

  amp: true
  amp_dtype: bfloat16
  accumulation_steps: 1

augmentation:
  enabled: true
  time_mask_ratio: 0.1
  subcarrier_mask_ratio: 0.1
  noise_std: 0.05
  scale_min: 0.9
  scale_max: 1.1
  p: 0.5

text_generation:
  num_paraphrases: 5
  use_llm: false
  text_level: level1

logging:
  use_wandb: false
  project_name: csi-text-alignment
  log_every_n_steps: 50
  checkpoint_dir: /home/sagemaker-user/Multimodal_CSI_Text/Model/checkpoints

evaluation:
  zero_shot: true
  ambient_qa: true
  cross_task: false
  cross_dataset: false

s3:
  enabled: true
  bucket: rnd-sagemaker
  prefix: Multimodal_CSI_Text
  sync_checkpoints: true
  sync_evaluation: true
  sync_dataset: true
