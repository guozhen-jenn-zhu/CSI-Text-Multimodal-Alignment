name: csibench
source_prefix: CSI-Bench    # S3 sub-path under Data/fm_downstream/

# Standalone tasks — each has its own H5 files, metadata, and splits.
tasks:
  fall_detection:
    folder: FallDetection
    h5_key: CSI_amps
    type: standalone
  motion_source:
    folder: MotionSourceRecognition
    h5_key: CSI_amps
    type: standalone
    fine_grained_labels: true  # override binary label_mapping with 4-class

# Multitask — one shared pool of H5 files, per-task metadata and splits.
multitask:
  folder: Multitask/H5
  h5_key: CSI_amps
  h5_subdir: sub_Human         # H5 files live here (copied once)
  tasks:
    har:
      metadata_folder: HumanActivityRecognition
    proximity:
      metadata_folder: ProximityRecognition
    user_id:
      metadata_folder: HumanIdentification
  composite_attributes:
    - user
    - activity
    - distance

preprocessing:
  input_channels: 1
  target_subcarriers: 64
  target_time_steps: 500
  normalize: true
